input SubmitReviewInput {
  questionVersionId: ID!
  content: String
  attachments: [Upload!]
  reviewerId: ID
}

input SaveReviewInput {
  questionVersionId: ID!
  reviewerId: ID!
  responses: String
}

type ReviewStatus {
  pending: Boolean
  submitted: Boolean
}

type Review {
  id: ID!
  questionVersionId: ID!
  reviewerId: ID!

  content: String
  attachments: [Attachment!]
  status: ReviewStatus
  responses: String
}

extend type Query {
  getReview(questionVersionId: ID!, reviewerId: ID!): Review!
}

extend type Mutation {
  saveReview(
    questionVersionId: ID!
    reviewerId: ID!
    responses: String!
  ): Review!
  submitReview(input: SubmitReviewInput!): ID!
}
